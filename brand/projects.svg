      <text x="110" y="212" font-size="21" font-weight="700" fill="#e6e9e2">Lumen</text>
      <text x="110" y="236" font-size="12" fill="#8a948d">E-commerce · UX · UI · Motion · 2026</text>
      <text x="48" y="270" font-size="13" fill="#8a948d">A storefront that behaves like a gallery — dark walls, one warm source per product. Edge-rendered, AVIF imagery, +38% conversion.</text>
