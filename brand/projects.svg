      <text x="110" y="88" font-size="12" fill="#8a948d">Fintech · UX · UI · Engineering · 2026</text>
      <text x="48" y="122" font-size="13" fill="#8a948d">A dark, precise fintech platform — every trade in the same room as the market. WebGL portfolio surface, 11 → 4 order fields, 99.9% uptime.</text>
